[hooks]
postinstall = ["prek install", { task = "ansible-collections" }]

[tools]
"pipx:ansible-core" = "latest"
prek = "latest"
uv = "latest"
shellcheck = "latest"
taplo = "latest"

[tasks.lint]
description = "Run all formatters and static checks"
raw_args = true
run = "prek run --all-files"

[tasks.provision]
description = "Run Ansible playbook to provision local machine"
interactive = true
raw_args = true
run = "ansible-playbook -K -i hosts.localhost local.yml"

[tasks.ansible-collections]
description = "Ensure required Ansible collections are installed"
outputs = [".ansible/collections/"]
raw_args = true
run = [
  "ansible-galaxy collection install --collections-path .ansible/collections -r requirements.yml --upgrade",
  "touch .ansible/collections/",
]
sources = ["requirements.yml"]
