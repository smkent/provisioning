- name: Set sddm as the default display manager
  block:
  - name: Configure default display manager executable
    ansible.builtin.copy:
      content: "/usr/bin/sddm"
      dest: /etc/X11/default-display-manager
    register: etc_default_dm
    become: true

  - name: Configure sddm
    when: etc_default_dm.changed
    block:
    - name: Configure sddm as default in debconf
      ansible.builtin.debconf:
        name: sddm
        question: shared/default-x-display-manager
        vtype: string
        value: sddm
      register: reconfigure_sddm
      become: true

    - name: Apply sddm configuration using dpkg-reconfigure
      ansible.builtin.command: dpkg-reconfigure sddm
      environment:
        DEBIAN_FRONTEND: noninteractive
        DEBCONF_NONINTERACTIVE_SEEN: true
      become: true
      when: reconfigure_sddm.changed
