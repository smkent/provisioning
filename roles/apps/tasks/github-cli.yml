- name: Add GitHub CLI apt repository
  ansible.builtin.deb822_repository:
    name: github-cli
    uris:
    - "https://cli.github.com/packages"
    suites:
    - stable
    components:
    - main
    signed_by: "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
    architectures: amd64
    state: present
    enabled: true
  register: github_cli_apt_repo
  become: true

- name: Install GitHub CLI
  ansible.builtin.apt:
    pkg:
    - gh
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if github_cli_apt_repo.changed else 600 }}"
  become: true
