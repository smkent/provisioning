  - name: Add Google apt repository
    ansible.builtin.deb822_repository:
      name: google
      uris:
        - "http://dl.google.com/linux/chrome/deb"
      suites:
        - stable
      components:
        - main
      signed_by: "https://dl.google.com/linux/linux_signing_key.pub"
      architectures: amd64
      state: present
      enabled: true
    register: google_apt_repo
    become: true

  - name: Disable Google's automatic repository management
    ansible.builtin.copy:
      content: |-
        repo_add_once="false"
        repo_reenable_on_distupgrade="false"
      dest: /etc/default/google-chrome
    become: true

  - name: Install Google Chrome
    ansible.builtin.apt:
      pkg:
        - google-chrome-stable
      state: present
      update_cache: true
      cache_valid_time: "{{ 0 if google_apt_repo.changed else 600 }}"
    become: true

  - name: Configure Google Chrome default settings
    block:
      - name: Create Google Chrome managed policies directory
        ansible.builtin.file:
          path: /etc/opt/chrome/policies/managed
          state: directory
          mode: "0755"
        become: true

      - name: Create Google Chrome recommended policies directory
        ansible.builtin.file:
          path: /etc/opt/chrome/policies/recommended
          state: directory
          mode: "0755"
        become: true

      - name: Configure Google Chrome mandatory policies
        ansible.builtin.copy:
          src: google-chrome-policies-managed.json
          dest: /etc/opt/chrome/policies/managed/policies.json
          mode: "0644"
        become: true

      - name: Configure Google Chrome recommended policies
        ansible.builtin.copy:
          src: google-chrome-policies-recommended.json
          dest: /etc/opt/chrome/policies/recommended/policies.json
          mode: "0644"
        become: true
