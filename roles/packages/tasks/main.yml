- name: 'Include apt package tasks'
  ansible.builtin.include_tasks: apt.yml

- name: 'Include Docker package tasks'
  ansible.builtin.include_tasks: docker.yml

- name: 'Include Google Chrome package tasks'
  ansible.builtin.include_tasks: google-chrome.yml

- name: 'Include LibreOffice package tasks'
  ansible.builtin.include_tasks: libreoffice.yml

- name: 'Include Signal package tasks'
  ansible.builtin.include_tasks: signal.yml

- name: 'Include package tasks for {{ ansible_facts["distribution"] }} {{ ansible_facts["distribution_version"] }}'
  ansible.builtin.include_tasks: '{{ item }}'
  with_first_found:
  - files:
    - '{{ ansible_facts["distribution"] | lower }}-{{ ansible_facts["distribution_version"] }}.yml'
  - skip: true
