[org/gnome/desktop/input-sources]
xkb-options=['caps:swapescape']

[org/gnome/shell]
favorite-apps=['firefox.desktop', 'google-chrome.desktop', 'nemo.desktop', 'org.gnome.Ptyxis.desktop', 'org.gnome.TextEditor.desktop', 'org.gnome.Calculator.desktop', 'signal-desktop.desktop', 'libreoffice-writer.desktop', 'libreoffice-calc.desktop', 'gnucash.desktop']

[org/gnome/shell/extensions/copyous]
auto-hide-search=true
clipboard-orientation='vertical'
clipboard-position-horizontal='top'
clipboard-position-vertical='fill'
clipboard-size=500
database-backend='json'
disable-hljs-dialog=true
dynamic-item-height=true
header-controls-visibility='visible-on-hover'
incognito=false
item-height=100
item-width=300
open-clipboard-dialog-shortcut=['<Alt><Super>v']
send-notification=false
show-at-cursor=false
show-at-pointer=true
show-content-indicator=false
show-header=false
show-indicator=true
show-item-title=true
toggle-incognito-mode-shortcut=['<Control><Alt><Super>v']
wiggle-indicator=true

[org/gnome/shell/extensions/copyous/file-item]
file-preview-visibility='file-info'

[org/gnome/shell/extensions/copyous/link-item]
link-preview-orientation='horizontal'

[org/gnome/shell/extensions/copyous/theme]
theme='yaru'

[org/gnome/shell/extensions/dash-to-panel]
appicon-margin=0
appicon-padding=4
click-action='TOGGLE-CYCLE'
dot-position='TOP'
dot-size=2
dot-style-focused='SEGMENTED'
dot-style-unfocused='DOTS'
enter-peek-mode-timeout=50
extension-version=73
global-border-radius=1
hot-keys=true
hotkeys-overlay-combo='TEMPORARILY'
panel-anchors='{"unknown-unknown":"MIDDLE"}'
panel-element-positions='{"unknown-unknown":[{"element":"activitiesButton","visible":true,"position":"stackedTL"},{"element":"leftBox","visible":true,"position":"stackedTL"},{"element":"showAppsButton","visible":true,"position":"centerMonitor"},{"element":"taskbar","visible":true,"position":"centerMonitor"},{"element":"centerBox","visible":true,"position":"centered"},{"element":"rightBox","visible":true,"position":"stackedBR"},{"element":"dateMenu","visible":true,"position":"stackedBR"},{"element":"systemMenu","visible":true,"position":"stackedBR"},{"element":"desktopButton","visible":false,"position":"stackedBR"}]}'
panel-lengths='{}'
panel-positions='{"unknown-unknown": "TOP"}'
panel-sizes='{"unknown-unknown": 40}'
show-apps-icon-file='/usr/share/icons/Yaru/scalable/places/start-here-symbolic.svg'
