  - name: Set up smkent's authorized_keys
    ansible.posix.authorized_key:
      user: smkent
      state: present
      key: "{{ item }}"
    with_file:
      - yubikey.pub

  - name: Install ssh packages
    ansible.builtin.apt:
      pkg:
        - ssh
      state: present
      update_cache: true
      cache_valid_time: 600
    become: true

  - name: Configure ssh login settings
    ansible.builtin.copy:
      dest: /etc/ssh/sshd_config.d/settings-login
      content: |
        PasswordAuthentication: no
        StreamLocalBindUnlink: yes
      owner: root
      group: root
      mode: "0644"
    become: true
    notify:
      - restart-ssh

  - name: Configure ssh cryptography settings
    ansible.builtin.copy:
      dest: /etc/ssh/sshd_config.d/settings-crypto
      content: |
        KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512@openssh.com,curve25519-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group-exchange-sha256
        Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes256-ctr
        MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
        HostKey /etc/ssh/ssh_host_ed25519_key
        RekeyLimit 128M 15m
      owner: root
      group: root
      mode: "0644"
    become: true
    notify:
      - restart-ssh
