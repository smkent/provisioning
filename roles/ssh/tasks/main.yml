  - name: Set up smkent's authorized_keys
    ansible.posix.authorized_key:
      user: smkent
      state: present
      key: "{{ item }}"
    with_file:
      - yubikey.pub

  - name: Install ssh packages
    ansible.builtin.apt:
      pkg:
        - ssh
      state: present
      update_cache: true
      cache_valid_time: 600
    become: true

  - name: Configure ssh login settings
    ansible.builtin.copy:
      dest: /etc/ssh/sshd_config.d/settings-login
      content: |
        PasswordAuthentication: no
        StreamLocalBindUnlink: yes
      owner: root
      group: root
      mode: "0644"
    become: true
    notify:
      - restart-ssh
